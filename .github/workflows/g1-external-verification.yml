name: G1 external verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g1-external-verification.yml'
      - 'verification/**'
      - 'supply/**'

permissions:
  contents: write

concurrency:
  group: g1-external-verification-6f39aa53e9bb863b6c8fb5c719806f055646de49
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: AgentGears/Fifty
  TARGET_COMMIT: 6f39aa53e9bb863b6c8fb5c719806f055646de49
  TARGET_TREE: c0153105eeea5b55d890cc0a7e83bbb586ecd890
  RUNTIME_VERSION: go1.27.1
  RUNTIME_ARCHIVE_SHA256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
  CHECK_TIMEOUT_SECONDS: '600'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out external boundary
        env:
          BOUNDARY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth=1 "https://x-access-token:${BOUNDARY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" boundary

      - name: Acquire and verify approved runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${RUNTIME_VERSION}.linux-amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "https://go.dev/dl/${RUNTIME_VERSION}.linux-amd64.tar.gz"
          echo "${RUNTIME_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -C "$RUNNER_TEMP/runtime" -xzf "$archive"
          echo "$RUNNER_TEMP/runtime/go/bin" >> "$GITHUB_PATH"

      - name: Check out exact Fifty revision
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${TARGET_REPOSITORY}.git" target
          git -C target fetch --depth=1 origin "$TARGET_COMMIT"
          git -C target checkout --detach "$TARGET_COMMIT"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"

      - name: Run bounded verifier
        id: verification
        run: |
          set -u -o pipefail
          receipt="$GITHUB_WORKSPACE/receipt.json"
          set +e
          timeout --signal=TERM --kill-after=15s 3600s \
            bash boundary/verification/External_G1_Verification_Runner_v1.5.sh \
              --repo "$GITHUB_WORKSPACE/target" \
              --supply-map "$GITHUB_WORKSPACE/boundary/supply/External_Supply_Map_G1_v0.1.md" \
              --denylist "$GITHUB_WORKSPACE/boundary/supply/External_Namespace_Denylist_G1_v0.1.txt" \
              --receipt "$receipt"
          rc=$?
          set -e
          if [[ ! -s "$receipt" ]]; then
            cat > "$receipt" <<JSON
          {
            "contract_version": "1.5",
            "status_context": "fifty/external-verification",
            "result": "FAIL",
            "terminal_stage": "workflow_process_watchdog_or_runner_failure",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target_commit_sha": "$TARGET_COMMIT",
            "observed_commit_sha": "$(git -C target rev-parse HEAD 2>/dev/null || true)",
            "target_tree_sha": "$TARGET_TREE",
            "observed_tree_sha": "$(git -C target rev-parse HEAD^{tree} 2>/dev/null || true)",
            "runtime": "$(go version 2>/dev/null || true)",
            "approved_supply_map_sha256": "f69369be68f079d0e0dcc367e4a8eb5c24626097414d1d909fe303cdc74a17ba",
            "observed_supply_map_sha256": "$(sha256sum boundary/supply/External_Supply_Map_G1_v0.1.md | awk '{print $1}')",
            "approved_denylist_sha256": "10f941528bd53e8dd0ff2465c8b038a85f15f3c87248a098bf8ebfedd81a65d8",
            "observed_denylist_sha256": "$(sha256sum boundary/supply/External_Namespace_Denylist_G1_v0.1.txt | awk '{print $1}')",
            "watchdog_seconds_per_check": 600,
            "checks": {},
            "worktree_clean_before": false,
            "worktree_clean_after": false
          }
          JSON
          fi
          jq . "$receipt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Persist terminal receipt
        id: persist
        env:
          BOUNDARY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd boundary
          receipt_path="receipts/${TARGET_COMMIT}/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "$(dirname "$receipt_path")"
          cp "$GITHUB_WORKSPACE/receipt.json" "$receipt_path"
          receipt_sha256=$(sha256sum "$receipt_path" | awk '{print $1}')
          git config user.name "fifty-external-verifier"
          git config user.email "fifty-external-verifier@users.noreply.github.com"
          git add "$receipt_path"
          git commit -m "Record G1 external verification receipt for ${TARGET_COMMIT}"
          git push origin HEAD:main
          receipt_commit=$(git rev-parse HEAD)
          echo "receipt_path=$receipt_path" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"
          echo "receipt_commit=$receipt_commit" >> "$GITHUB_OUTPUT"
          echo "receipt_url=https://github.com/${GITHUB_REPOSITORY}/blob/${receipt_commit}/${receipt_path}" >> "$GITHUB_OUTPUT"

      - name: Publish commit-bound status
        env:
          FIFTY_STATUS_TOKEN: ${{ secrets.FIFTY_STATUS_TOKEN }}
          RECEIPT_URL: ${{ steps.persist.outputs.receipt_url }}
        run: |
          set -euo pipefail
          bash boundary/verification/External_G1_Status_Publisher_v1.0.sh \
            --receipt "$GITHUB_WORKSPACE/receipt.json" \
            --target-url "$RECEIPT_URL"

      - name: Enforce verification success
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verification.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "${VERIFY_EXIT_CODE:-1}" = "0"
          test "$(jq -r '.result' "$GITHUB_WORKSPACE/receipt.json")" = "PASS"
